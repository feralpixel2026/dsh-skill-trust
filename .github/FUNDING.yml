# 赞助与支持
#
# 用户目前没有提出赞助需求，因此本文件全部字段保持注释状态。
# 需要开启时，取消对应行的注释并填入实际账号即可（GitHub 会自动在仓库页显示 Sponsor 按钮）。
#
# 参考：https://docs.github.com/repositories/managing-your-repositorys-settings-and-features/customizing-your-repository/displaying-a-sponsor-button-in-your-repository
#
# github: [feralpixel2026]
# patreon: # 替换为 Patreon 用户名
# open_collective: # 替换为 Open Collective slug
# ko_fi: # 替换为 Ko-fi 用户名
# tidelift: # 例如 npm/dsh-skill-trust
# community_bridge: # 替换为 Community Bridge 项目名
# liberapay: # 替换为 Liberapay 用户名
# issuehunt: # 替换为 IssueHunt 用户名
# otechie: # 替换为 Otechie 用户名
# lfx_crowdfunding: # 替换为 LFX Crowdfunding 项目名
# custom: ['https://example.com/sponsor']
